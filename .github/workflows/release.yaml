name: release

# Fork release pipeline: builds installable packages and publishes them to
# this repository's GitHub Releases. Needs no upstream-only secrets; Android
# uses the KEYSTORE/KEY_ALIAS/STORE_PASSWORD/KEY_PASSWORD secrets when present
# and otherwise falls back to the debug key (package com.follow.clash.dev).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      desktop:
        description: 'Also build Windows / Linux / macOS'
        type: boolean
        default: true
      version:
        description: 'Version override, e.g. 0.9.1 or 0.9.1+2026101601 (blank = pubspec.yaml)'
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      app_env: ${{ steps.meta.outputs.app_env }}
    # APP_ENV only drives the corner banner, which a fork release should not show.
    steps:
      - id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ "$tag" == *-* ]]; then pre=true; env=stable; else pre=false; env=stable; fi
          else
            branch="${GITHUB_REF_NAME//\//-}"
            tag="build-${branch}-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
            pre=true; env=stable
          fi
          {
            echo "tag=$tag"
            echo "prerelease=$pre"
            echo "app_env=$env"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    name: Build ${{ matrix.platform }}${{ matrix.arch && format(' {0}', matrix.arch) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: windows
            os: windows-2022
            arch: amd64
            desktop: true
          - platform: linux
            os: ubuntu-22.04
            arch: amd64
            desktop: true
          - platform: macos
            os: macos-latest
            arch: arm64
            desktop: true
          # Intel Macs, built natively like upstream so the Go core (with the
          # Tailscale with_gvisor tag), the Rust libraries and the Flutter app
          # are all x86_64.
          - platform: macos
            os: macos-15-intel
            arch: amd64
            desktop: true
    steps:
      - name: Skip desktop
        id: gate
        shell: bash
        run: |
          if [[ "${{ matrix.desktop }}" == "true" && "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.desktop }}" != "true" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android signing
        if: steps.gate.outputs.skip != 'true' && matrix.platform == 'android'
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::No KEYSTORE secret, the APK is signed with a debug key"
            exit 0
          fi
          echo "$KEYSTORE" | base64 --decode > android/app/keystore.jks
          {
            echo "keyAlias=$KEY_ALIAS"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
          } >> android/local.properties

      - name: Setup Go
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Rust cache
        if: steps.gate.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}-${{ matrix.arch || 'all' }}
          workspaces: |
            services/helper
            plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Java
        if: steps.gate.outputs.skip != 'true' && matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        if: steps.gate.outputs.skip != 'true' && matrix.platform == 'android'
        uses: gradle/actions/setup-gradle@v6

      - name: Setup NDK
        if: steps.gate.outputs.skip != 'true' && matrix.platform == 'android'
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Enable git long paths (Windows)
        if: steps.gate.outputs.skip != 'true' && matrix.platform == 'windows'
        run: git config --global core.longpaths true

      - name: Setup Flutter
        if: steps.gate.outputs.skip != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Xcode
        if: steps.gate.outputs.skip != 'true' && matrix.platform == 'macos'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Install Linux build dependencies
        if: steps.gate.outputs.skip != 'true' && matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libayatana-appindicator3-dev libsecret-1-dev rpm patchelf locate libfuse2

      - name: Override version
        if: steps.gate.outputs.skip != 'true' && inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          current="$(sed -n 's/^version: *//p' pubspec.yaml)"
          if [[ "$VERSION" != *+* ]]; then VERSION="$VERSION+${current#*+}"; fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]] || { echo "Bad version: $VERSION" >&2; exit 1; }
          sed -i.bak "s/^version: .*/version: $VERSION/" pubspec.yaml && rm pubspec.yaml.bak
          grep '^version:' pubspec.yaml

      # Upstream turns Impeller off on Intel Macs (see its flutter-upgrade notes).
      - name: Disable Impeller on Intel macOS
        if: steps.gate.outputs.skip != 'true' && matrix.platform == 'macos' && matrix.arch == 'amd64'
        run: plutil -replace FLTEnableImpeller -bool NO macos/Runner/Info.plist

      - name: Get Flutter dependencies
        if: steps.gate.outputs.skip != 'true'
        run: |
          flutter --version
          flutter pub get

      - name: Build
        if: steps.gate.outputs.skip != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: dart setup.dart ${{ matrix.platform }} --env ${{ needs.meta.outputs.app_env }} -v

      # AGP drops JAR (v1) signing whenever minSdk >= 24, and some Android
      # installers then report the APK as unsigned, so re-sign with all schemes.
      - name: Re-sign APKs with v1+v2+v3
        if: steps.gate.outputs.skip != 'true' && matrix.platform == 'android' && hashFiles('android/app/keystore.jks') != ''
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          for apk in dist/*.apk; do
            "$apksigner" sign --ks android/app/keystore.jks --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
              --min-sdk-version 21 --v1-signing-enabled true \
              --v2-signing-enabled true --v3-signing-enabled true \
              --out "$apk.signed" "$apk"
            mv "$apk.signed" "$apk"
            rm -f "$apk.signed.idsig"
          done

      - name: Verify APK signatures
        if: steps.gate.outputs.skip != 'true' && matrix.platform == 'android'
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          shopt -s nullglob
          apks=(dist/*.apk)
          test ${#apks[@]} -gt 0 || { echo "No APK in dist" >&2; exit 1; }
          for apk in "${apks[@]}"; do
            echo "== $apk"
            out="$("$apksigner" verify -v --print-certs --min-sdk-version 21 "$apk")" || { echo "$out"; exit 1; }
            echo "$out" | grep -E 'Verified using v[123] scheme|certificate DN|SHA-256 digest'
            for scheme in v1 v2 v3; do
              echo "$out" | grep -q "Verified using $scheme scheme.*: true" || {
                echo "::error::$apk is not signed with the $scheme scheme" >&2; exit 1; }
            done
          done

      - name: Check macOS architecture
        if: steps.gate.outputs.skip != 'true' && matrix.platform == 'macos'
        env:
          WANT: ${{ matrix.arch == 'amd64' && 'x86_64' || 'arm64' }}
        run: |
          set -euo pipefail
          dmg="$(ls dist/*-macos-${{ matrix.arch }}.dmg)"
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" >/dev/null
          trap 'hdiutil detach "$mnt" >/dev/null || true' EXIT
          app="$(ls -d "$mnt"/*.app | head -1)"
          bad=0
          while IFS= read -r -d '' bin; do
            if file "$bin" | grep -q 'Mach-O'; then
              archs="$(lipo -archs "$bin" 2>/dev/null || true)"
              echo "$archs  ${bin#"$mnt"/}"
              [[ " $archs " == *" $WANT "* ]] || bad=1
            fi
          done < <(find "$app" -type f \( -perm -111 -o -name '*.dylib' \) -print0)
          test "$bad" = 0 || { echo "::error::$dmg has binaries without $WANT" >&2; exit 1; }

      - name: Upload artifact
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
          path: ./dist
          if-no-files-found: error

  release:
    needs: [ meta, build ]
    if: ${{ !cancelled() && needs.meta.result == 'success' && needs.build.result == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: ./dist/
          pattern: artifact-*
          merge-multiple: true

      - name: Check artifacts
        run: |
          ls -la dist
          test -n "$(ls dist)" || { echo "No artifacts were built" >&2; exit 1; }
          cd dist && sha256sum ./* > SHA256SUMS

      - name: Setup Flutter
        if: startsWith(github.ref, 'refs/tags/v')
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # Notes come from changelog.json (written by `tool/changelog.dart release`
      # before tagging). A tag that skipped that step gets its section derived
      # from the conventional commits since the previous tag instead.
      - name: Release notes
        shell: bash
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          fallback() {
            {
              echo "Automated build of \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA::7}\`."
              echo
              echo "Android: use \`*-android-arm64-v8a.apk\` for most phones."
              echo "macOS: \`*-macos-arm64.dmg\` for Apple silicon, \`*-macos-amd64.dmg\` for Intel Macs."
              echo
              echo "Build log: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            } > notes.md
          }
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            fallback
            exit 0
          fi
          generate() {
            flutter pub get &&
            yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml &&
            if ! jq -e --arg tag "$TAG" '.versions[] | select(.tag == $tag)' changelog.json > /dev/null; then
              echo "::warning::$TAG is not in changelog.json; deriving its notes from git"
              dart run tool/changelog.dart build
            fi &&
            dart run tool/changelog.dart render fork-release --tag "$TAG" \
              --repo "$GITHUB_REPOSITORY" --assets dist --out notes.md
          }
          if ! generate; then
            echo "::warning::Release notes generation failed; publishing the short notes"
            fallback
          fi
          git checkout -- pubspec.yaml changelog.json 2>/dev/null || true
          cat notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.meta.outputs.tag }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          body_path: notes.md
          files: ./dist/*
